# All paths are relative to the repo root. Non-public cohorts live in data/private (gitignored);
# the pipeline runs without them (Internal lung OOD and MGH are then skipped).
paths:
  bulk_public: data/bulk
  bulk_private: data/private
  visium_raw: data/visium/raw
  visium_h5ad: data/visium/h5ad
  processed: data/processed
  geomx: data/private/geomx
  results: results

cohorts:
  # Bulk cohorts held out whole (true holdout, notebook 04 only).
  # TCGA-BLCA / TCGA-LUSC: HookNet-TLS manual annotations (Zenodo 10614928) on the diagnostic FFPE slide, RNA from a
  # different frozen piece -> holdout labels only, never fitted.
  ood: [Internal_lung, CPTAC-PAAD, CPTAC-ccRCC, TCGA-BLCA, TCGA-LUSC]
  # Visium cohorts held out whole (no spot in gene filter, offset, prior or training): scored once in notebook 04.
  visium_ood: [GSE273952, GSE351843]
  # Roles on top of the patient split: Visium train sections = gold training (teacher); these bulk cohorts, train
  # split only, are self-distilled (teacher pseudo-labels, gold labels never fitted); their test split stays the
  # in-distribution bulk test. Any other non-OOD bulk cohort is an error.
  distill: [TCGA-LUAD, TCGA-BRCA, TCGA-KIRC/KIRP/KICH, TCGA-PAAD]
  # GeoMx ROI / AOI units (kind geomx, unit roi; data/private/geomx, scripts/fetch_geomx.py). geomx_train would enter
  # the gold training rows; both series are held out: GSE271255 covers only ~41 % of the model genes (CTA panel).
  geomx_train: []
  geomx_holdout: [GSE271255, GSE276935]
  # Gene panels of the previous model were derived on these cohorts -> excluded when scoring prev_panel.
  prev_panel_derived_on: [TCGA-LUAD, TCGA-BRCA]

labels:
  # GSE351843 `aggregate` (lymphoid aggregate without a called follicle) = immature TLS (true) or excluded (false).
  # Notebook 04 reports the other mapping as a sensitivity analysis whatever is set here.
  aggregate_is_tls: true

split:
  seed: 42
  bulk_test_frac: 0.2
  visium_test_frac: 0.25
  cv_folds: 5

units:
  ks: [1, 7, 19]
  cap_per_scale: 300        # centres per section and scale (train)
  max_positive_per_scale: 150

features:
  n_top_variable: 5000
  min_bulk_median: 1.0      # log2(TPM + 1)
  min_spot_detection: 0.02  # share of spots with count > 0
  n_panel: 200
  n_pair_genes: 30
  variants:                 # stage A: representation × platform offset
    - {representation: rank, offset: true}
    - {representation: rank, offset: false}
    - {representation: log, offset: true}
    - {representation: log, offset: false}

models:
  stage_a: [{family: enet, selector: corr}]
  stage_b:
    - {family: signature, selector: null}
    - {family: prev_panel, selector: null}
    - {family: ktsp, selector: corr}
    - {family: ktsp, selector: shap}
    - {family: enet, selector: corr}
    - {family: enet, selector: shap}
    - {family: lgbm, selector: corr}
    - {family: lgbm, selector: shap}
  # Direct 3-class (no TLS / immature / mature) candidates, compared with the two-head product in the same CV.
  three_class: [{family: lgbm, selector: corr}, {family: lgbm, selector: shap}]

ici:
  dir: data/private/ici            # one h5ad per treated study (local only)
  # Studies whose TMB column is a mutation count (WES), not mutations / Mb -> no TMB-high call.
  tmb_count_scale: [PUB_SKCM_Hugo_ICI, PUB_SKCM_ICP_Liu, PUB_SKCM_Liang_ICI, PUB_SKCM_Riaz_ICI,
                    SKCM-aCTLA4-VanAllen, PUB_ccRCC_Immotion150_and_151_ICI, PUB_ccRCC_Immotion150_and_151_TKI]
  covariates: [icb_class, age, sex, stage, site, location]
  n_boot: 20
  seed: 0
