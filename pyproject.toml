[project]
name = "tls-model"
version = "0.1.0"
description = "One expression-only TLS model for Visium spots and bulk RNA-seq"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "h5py>=3.10",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "statsmodels>=0.15.0",
    "lifelines>=0.30.3",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tls_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
